<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="UCC Admin — News management">
  <title>News Admin — UCC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 32px 20px 80px; }
    .admin-header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:24px; }
    .admin-header h1 { font-size: 1.6rem; color: var(--ucc-primary); }
    .admin-header .muted { color: var(--ucc-gray); margin-top: 4px; }
    .admin-card { background: var(--white); border: 1px solid var(--gray-200); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
    .admin-card h2 { font-size: 1.05rem; color: var(--ucc-primary); margin-bottom: 12px; }
    .admin-table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
    .admin-table th, .admin-table td { text-align: left; padding: 10px 10px; border-bottom: 1px solid var(--gray-200); vertical-align: top; }
    .admin-table th { font-weight: 600; color: var(--gray-700); background: var(--gray-50); }
    .admin-table tr:hover td { background: var(--gray-50); }
    .tag { display:inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; }
    .tag-published { background: #d1fae5; color: #065f46; }
    .tag-draft { background: #fef3c7; color: #92400e; }
    .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .admin-form .field { margin-bottom: 12px; }
    .admin-form label { display:block; font-size: 0.82rem; font-weight: 600; margin-bottom: 5px; color: var(--gray-700); }
    .admin-form input, .admin-form textarea { width: 100%; padding: 9px 10px; border: 1px solid var(--gray-300); border-radius: 8px; font-family: inherit; font-size: 0.88rem; }
    .admin-form textarea { resize: vertical; min-height: 90px; }
    .admin-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .flash { padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 0.88rem; }
    .flash-ok { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    .flash-err { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
    .empty { text-align: center; padding: 36px 14px; color: var(--ucc-gray); }
    .hidden { display: none !important; }
    @media (max-width: 720px) {
      .admin-form .row { grid-template-columns: 1fr; }
      .admin-table th:nth-child(2), .admin-table td:nth-child(2),
      .admin-table th:nth-child(4), .admin-table td:nth-child(4) { display: none; }
    }
  </style>
</head>
<body>
  <div id="admin-gate" class="admin-wrap">
    <div class="admin-card" style="max-width:420px;margin:60px auto;text-align:center">
      <h1>🔒 Admin Access</h1>
      <p class="muted" style="margin-top:8px">Sign in with your admin credentials to manage news.</p>
      <form id="admin-gate-form" class="admin-form" style="margin-top:18px;text-align:left">
        <div class="field">
          <label for="g-identifier">Email or phone number</label>
          <input id="g-identifier" type="text" placeholder="admin@ucc.co.tz or +255 7xx xxx xxx" required autocomplete="username">
        </div>
        <div class="field" id="g-password-wrap">
          <label for="g-password">Password</label>
          <input id="g-password" type="password" placeholder="••••••••" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn-primary" id="g-submit" style="width:100%;margin-top:6px">Sign in to Admin</button>
      </form>
      <div id="gate-flash" class="admin-flash admin-flash-error hidden" style="margin-top:14px"></div>
      <div class="btn-row" style="justify-content:center;margin-top:18px">
        <a class="btn-secondary" href="../index.html" style="text-decoration:none">Back to site</a>
      </div>
    </div>
  </div>

  <div id="admin-main" class="admin-wrap hidden">
    <div class="admin-header">
      <div>
        <h1>📰 News Admin</h1>
        <p class="muted">Manage UCC news &amp; updates</p>
      </div>
      <div class="btn-row" style="margin-top:0">
        <button class="btn-primary" id="refresh-btn">Refresh</button>
        <button class="btn-secondary" id="logout-btn">Logout</button>
        <a class="btn-secondary" href="../index.html" style="text-decoration:none">Back to site</a>
      </div>
    </div>

    <div id="flash-area"></div>

    <div class="admin-card">
      <h2>Create news item</h2>
      <form id="news-form" class="admin-form">
        <div class="field">
          <label for="n-title">Title</label>
          <input id="n-title" type="text" placeholder="Short headline" required>
        </div>
        <div class="field">
          <label for="n-summary">Summary</label>
          <input id="n-summary" type="text" placeholder="One-line teaser">
        </div>
        <div class="field">
          <label for="n-content">Content</label>
          <textarea id="n-content" placeholder="Full body text" required></textarea>
        </div>
        <div class="row">
          <div class="field">
            <label for="n-image">Image URL</label>
            <input id="n-image" type="url" placeholder="https://...">
          </div>
          <div class="field">
            <label for="n-source">Source URL</label>
            <input id="n-source" type="url" placeholder="https://...">
          </div>
        </div>
        <div class="row">
          <div class="field">
            <label for="n-pub">Published date</label>
            <input id="n-pub" type="datetime-local">
          </div>
          <div class="field">
            <label for="n-exp">Expires (optional)</label>
            <input id="n-exp" type="datetime-local">
          </div>
        </div>
        <div class="field">
          <label>
            <input id="n-published" type="checkbox"> Published (visible to public)
          </label>
        </div>
        <input type="hidden" id="n-id">
        <div class="btn-row">
          <button type="submit" class="btn-primary" id="form-submit">Create</button>
          <button type="button" class="btn-secondary hidden" id="form-cancel">Cancel edit</button>
        </div>
      </form>
    </div>

    <div class="admin-card">
      <h2>All items</h2>
      <div style="overflow-x:auto">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Title</th>
              <th>Status</th>
              <th>Published</th>
              <th>Source</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="news-tbody"></tbody>
        </table>
        <div id="news-empty" class="empty hidden">No news yet. Use the form above to create one.</div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/news.js"></script>
  <script src="js/news-admin.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    const apiBase = () => (typeof API_BASE_URL !== 'undefined' && API_BASE_URL) ? API_BASE_URL : '';

function flash(msg, ok) {
        const gateEl = $('#gate-flash');
        if (gateEl && $('#admin-gate').classList.contains('hidden') === false) {
          gateEl.textContent = msg;
          gateEl.className = 'admin-flash ' + (ok ? 'admin-flash-success' : 'admin-flash-error');
          gateEl.classList.remove('hidden');
        }
        const el = $('#flash-area');
        if (el) {
          const d = document.createElement('div');
          d.className = 'flash ' + (ok ? 'flash-ok' : 'flash-err');
          d.textContent = msg;
          el.appendChild(d);
          setTimeout(() => d.remove(), 4000);
        }
      }

    async function api(endpoint, opts = {}) {
      const base = apiBase();
      if (!base) return null;
      const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
      const token = localStorage.getItem('ucc_auth_token');
      if (token) headers['Authorization'] = 'Bearer ' + token;
      const ctrl = new AbortController();
      const tmo = setTimeout(() => ctrl.abort(), 8000);
      try {
        const r = await fetch(base + endpoint, { signal: ctrl.signal, headers, ...opts });
        clearTimeout(tmo);
        const txt = await r.text();
        if (!r.ok) throw new Error(r.status + ': ' + txt);
        return txt ? JSON.parse(txt) : null;
      } catch (e) {
        return null;
      }
    }

    async function tryAdminLogin(identifier, password) {
        const base = apiBase();
        if (!base) {
          // No backend — allow local admin session so the dashboard still loads.
          const fakeUser = { id: 'local-admin', email: identifier, fullName: 'UCC Administrator', role: 'ADMIN', isActive: true };
          const fakeToken = 'local-admin-token-' + Math.random().toString(36).slice(2);
          localStorage.setItem('ucc_auth_token', fakeToken);
          localStorage.setItem('ucc_auth_role', 'ADMIN');
          localStorage.setItem('ucc_auth_user', JSON.stringify(fakeUser));
          return true;
        }
        const looksLikePhone = /^\+?\d[\d\s\-]{7,}$/.test(identifier);
        const body = looksLikePhone ? { phone: identifier } : { email: identifier, password };
        const endpoint = looksLikePhone ? '/api/auth/visitor-login' : '/api/auth/login';
        const r = await fetch(base + endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await r.json().catch(() => ({}));
        if (!r.ok || !data.success) { flash(data.message || 'Login failed', false); return false; }
        const role = (data.user && data.user.role) ? data.user.role.toUpperCase() : '';
        if (role !== 'ADMIN' && role !== 'SUPERADMIN') { flash('Access denied: admin role required', false); return false; }
        localStorage.setItem('ucc_auth_token', data.token);
        localStorage.setItem('ucc_auth_role', role);
        localStorage.setItem('ucc_auth_user', JSON.stringify(data.user || {}));
        return true;
      }

    async function verifyAdmin() {
      const base = apiBase();
      const token = localStorage.getItem('ucc_auth_token');
      const role = localStorage.getItem('ucc_auth_role');
      // Offline mode: if no backend but token exists and role is ADMIN, allow access
      if (!base) {
        if (token && (role === 'ADMIN' || role === 'SUPERADMIN')) return true;
        return false;
      }
      if (!token) return false;
      const data = await api('/api/auth/me');
      if (!data || !data.success) { localStorage.removeItem('ucc_auth_token'); return false; }
      const r = (data.user && data.user.role) ? data.user.role.toUpperCase() : '';
      if (r !== 'ADMIN' && r !== 'SUPERADMIN') return false;
      return true;
    }

    function logout() {
      localStorage.removeItem('ucc_auth_token');
      localStorage.removeItem('ucc_auth_role');
      localStorage.removeItem('ucc_auth_user');
      window.location.href = 'login.html';
    }

    async function loadItems() {
      const base = apiBase();
      if (!base) {
        // Offline mode: use localStorage (fallback to seed data)
        let items = JSON.parse(localStorage.getItem('ucc_news_offline') || 'null');
        if (!items || !items.length) {
          if (window.UCCNews) {
            const seed = await window.UCCNews.load();
            if (seed && seed.length) { items = seed; }
          }
        }
        if (!items) items = [];
        renderTable(items);
        return;
      }
      const data = await api('/api/news/all');
      if (!data) { flash('Backend unreachable or not authorized.', false); return; }
      const items = Array.isArray(data) ? data : (data.items || data.news || []);
      renderTable(items);
    }

    function renderTable(items) {
      const tbody = $('#news-tbody');
      const empty = $('#news-empty');
      if (!items.length) { tbody.innerHTML = ''; empty.classList.remove('hidden'); return; }
      empty.classList.add('hidden');
      tbody.innerHTML = items.map(it => {
        const date = it.publishedAt ? new Date(it.publishedAt).toLocaleString() : '—';
        const exp = it.expiresAt ? new Date(it.expiresAt).toLocaleString() : '—';
        const pub = it.isPublished ? '<span class="tag tag-published">Published</span>' : '<span class="tag tag-draft">Draft</span>';
        return '<tr data-id="' + it.id + '">' +
          '<td><strong>' + esc(it.title) + '</strong><br><span class="muted">' + esc(it.summary || '') + '</span></td>' +
          '<td>' + pub + '</td>' +
          '<td>' + esc(date) + '</td>' +
          '<td><a href="' + esc(it.sourceUrl || '#') + '" target="_blank" rel="noopener">' + esc(it.sourceUrl || '—') + '</a><br><span class="muted">exp: ' + esc(exp) + '</span></td>' +
          '<td class="btn-row"><button class="btn-secondary" data-act="edit" data-id="' + it.id + '">Edit</button>' +
          '<button class="btn-secondary" data-act="toggle" data-id="' + it.id + '">' + (it.isPublished ? 'Unpublish' : 'Publish') + '</button>' +
          '<button class="btn-secondary" style="border-color:#b91c1c;color:#b91c1c" data-act="del" data-id="' + it.id + '">Delete</button></td>' +
          '</tr>';
      }).join('');
    }

    function esc(s) { return (s == null ? '' : String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    async function save(form) {
      const payload = {
        title: $('#n-title').value.trim(),
        summary: $('#n-summary').value.trim(),
        content: $('#n-content').value.trim(),
        imageUrl: $('#n-image').value.trim(),
        sourceUrl: $('#n-source').value.trim(),
        publishedAt: $('#n-pub').value ? new Date($('#n-pub').value).toISOString() : new Date().toISOString(),
        expiresAt: $('#n-exp').value ? new Date($('#n-exp').value).toISOString() : null,
        isPublished: $('#n-published').checked
      };
      if (!payload.title || !payload.content) { flash('Title and content are required', false); return; }
      const id = $('#n-id').value;
      const base = apiBase();
      if (!base) {
        // Offline mode: save to localStorage
        let items = JSON.parse(localStorage.getItem('ucc_news_offline') || '[]');
        if (id) {
          items = items.map(it => it.id === id ? { ...it, ...payload } : it);
        } else {
          const newItem = { ...payload, id: 'news-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6) };
          items.unshift(newItem);
        }
        localStorage.setItem('ucc_news_offline', JSON.stringify(items));
        flash(id ? 'Updated (offline)' : 'Created (offline)', true);
        resetForm();
        renderTable(items);
        return;
      }
      let url = base + '/api/news';
      let method = 'POST';
      if (id) { url += '/' + encodeURIComponent(id); method = 'PUT'; }
      const r = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + localStorage.getItem('ucc_auth_token') },
        body: JSON.stringify(payload)
      });
      const data = await r.json().catch(() => ({}));
      if (!r.ok) { flash((data.message || 'Save failed') + ' (' + r.status + ')', false); return; }
      flash(method === 'POST' ? 'Created' : 'Updated', true);
      resetForm();
      await loadItems();
    }

    async function togglePublish(id) {
      if (!confirm('Toggle published state?')) return;
      const base = apiBase();
      if (!base) {
        let items = JSON.parse(localStorage.getItem('ucc_news_offline') || '[]');
        items = items.map(it => it.id === id ? { ...it, isPublished: !it.isPublished } : it);
        localStorage.setItem('ucc_news_offline', JSON.stringify(items));
        flash('Toggled (offline)', true);
        renderTable(items);
        return;
      }
      const r = await api('/api/news/' + encodeURIComponent(id) + '/publish', {
        method: 'PATCH',
        body: JSON.stringify({ isPublished: true, publishedAt: new Date().toISOString() })
      });
      if (!r) { flash('Failed', false); return; }
      flash('Published', true);
      await loadItems();
    }

    async function removeItem(id) {
      if (!confirm('Delete this item permanently?')) return;
      const base = apiBase();
      if (!base) {
        let items = JSON.parse(localStorage.getItem('ucc_news_offline') || '[]');
        items = items.filter(it => it.id !== id);
        localStorage.setItem('ucc_news_offline', JSON.stringify(items));
        flash('Deleted (offline)', true);
        renderTable(items);
        return;
      }
      const r = await api('/api/news/' + encodeURIComponent(id), { method: 'DELETE' });
      if (!r) { flash('Failed', false); return; }
      flash('Deleted', true);
      await loadItems();
    }

    async function editItem(id) {
      const r = await api('/api/news/' + encodeURIComponent(id));
      if (!r) { flash('Failed to load', false); return; }
      $('#n-id').value = r.id || id;
      $('#n-title').value = r.title || '';
      $('#n-summary').value = r.summary || '';
      $('#n-content').value = r.content || '';
      $('#n-image').value = r.imageUrl || '';
      $('#n-source').value = r.sourceUrl || '';
      $('#n-pub').value = r.publishedAt ? r.publishedAt.slice(0, 16) : new Date().toISOString().slice(0, 16);
      $('#n-exp').value = r.expiresAt ? r.expiresAt.slice(0, 16) : '';
      $('#n-published').checked = r.isPublished !== false;
      $('#form-submit').textContent = 'Update';
      $('#form-cancel').classList.remove('hidden');
      $('#news-form').scrollIntoView({ behavior: 'smooth' });
    }

    function resetForm() {
      $('#news-form').reset();
      $('#n-id').value = '';
      $('#n-pub').value = new Date().toISOString().slice(0, 16);
      $('#form-submit').textContent = 'Create';
      $('#form-cancel').classList.add('hidden');
    }

    document.addEventListener('DOMContentLoaded', async function () {
      const authed = await verifyAdmin();
      if (authed) {
        $('#admin-gate').classList.add('hidden');
        $('#admin-main').classList.remove('hidden');
        wireApp();
        await loadItems();
        return;
      }
      const form = $('#admin-gate-form');
      const submit = $('#g-submit');
      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        submit.disabled = true;
        const identifier = $('#g-identifier').value.trim();
        const password = $('#g-password').value;
        if (!identifier) { flash('Enter email or phone number', false); submit.disabled = false; return; }
        const ok = await tryAdminLogin(identifier, password);
        if (ok) {
          $('#admin-gate').classList.add('hidden');
          $('#admin-main').classList.remove('hidden');
          wireApp();
          await loadItems();
        } else {
          submit.disabled = false;
        }
      });
    });

    function wireApp() {
      $('#logout-btn').addEventListener('click', logout);
      $('#news-form').addEventListener('submit', function (e) { e.preventDefault(); save(this); });
      $('#form-cancel').addEventListener('click', resetForm);
      $('#refresh-btn').addEventListener('click', loadItems);
      $('#news-tbody').addEventListener('click', function (e) {
        const btn = e.target.closest('button[data-act]');
        if (!btn) return;
        const act = btn.getAttribute('data-act');
        const id = btn.getAttribute('data-id');
        if (act === 'edit') editItem(id);
        else if (act === 'toggle') togglePublish(id);
        else if (act === 'del') removeItem(id);
      });
    }
  </script>
</body>
</html>

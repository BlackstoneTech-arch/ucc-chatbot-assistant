<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Chat with UCC Customer Care Assistant — University of Dar es Salaam Computing Centre.">
  <title>Chat — UCC Customer Care Assistant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="chat-page-body">
  <div id="news-marquee" class="news-marquee" role="status" aria-live="polite" aria-label="UCC news and updates">
    <div class="news-marquee-track" id="news-marquee-track"></div>
  </div>
  <div id="app" class="chat-page">
    <header class="chat-topbar" role="banner">
      <div class="chat-topbar-inner">
        <a href="index.html" class="chat-topbar-brand" aria-label="UCC Customer Care home">
          <span class="chat-topbar-logo" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </span>
          <span class="chat-topbar-title">UCC Assistant</span>
        </a>
        <div class="chat-topbar-center" aria-hidden="true">
          <span class="chat-topbar-model" id="chat-model-label">UCC · 2026/2027 Admissions</span>
        </div>
        <div class="chat-topbar-actions">
          <a href="login.html" class="icon-btn" aria-label="Login" title="Login / Admin" style="text-decoration:none">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M13.8 12H3"/>
            </svg>
          </a>
          <button type="button" class="icon-btn" id="new-chat-btn" aria-label="Start a new conversation" title="New chat">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M12 20h9M16.5 3.5a2.121 2.121 0 113 3L7 19l-4 1 1-4 12.5-12.5z"/>
            </svg>
          </button>
          <button type="button" class="icon-btn" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
            <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
            </svg>
            <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
          </button>
          <a href="index.html" class="icon-btn chat-topbar-home" aria-label="Back to home" title="Home">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
            </svg>
          </a>
          <button type="button" class="icon-btn" id="auth-btn" aria-label="Student login" title="Student login">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M15 3h4a2 2 0 012 2v14a2 2 0 01-2 2h-4M10 17l5-5-5-5M13.8 12H3"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main id="chat-widget" class="chat-widget" role="region" aria-label="UCC Customer Care chat">
      <div class="chat-container">
        <div id="chat-messages" class="chat-messages" aria-live="polite" aria-relevant="additions text">
          <div class="welcome-screen welcome-screen--full">
            <div class="welcome-orb" aria-hidden="true">
              <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
                <path d="M12 2a4 4 0 014 4v1.5a4 4 0 11-8 0V6a4 4 0 014-4zM5 11a7 7 0 1014 0M12 18v4M8 22h8"/>
              </svg>
            </div>
            <h2 class="welcome-title">How can I help you today?</h2>
            <p class="welcome-sub">I'm the UCC Customer Care Assistant. Ask me about programmes, admissions, fees, registration, ICT support, or download official documents.</p>
            <div class="suggested-prompts" role="group" aria-label="Suggested questions">
              <button class="prompt-card" type="button" data-prompt="I need the application pack for 2026/2027">
                <span class="prompt-icon" aria-hidden="true">📥</span>
                <span class="prompt-text">Get the 2026/2027 application pack</span>
              </button>
              <button class="prompt-card" type="button" data-prompt="How do I apply to UCC?">
                <span class="prompt-icon" aria-hidden="true">🎓</span>
                <span class="prompt-text">How do I apply to UCC?</span>
              </button>
              <button class="prompt-card" type="button" data-prompt="What programmes does UCC offer?">
                <span class="prompt-icon" aria-hidden="true">📚</span>
                <span class="prompt-text">What programmes does UCC offer?</span>
              </button>
              <button class="prompt-card" type="button" data-prompt="What are the tuition fees?">
                <span class="prompt-icon" aria-hidden="true">💰</span>
                <span class="prompt-text">What are the tuition fees?</span>
              </button>
              <button class="prompt-card" type="button" data-prompt="Compare DCIT and DBIT">
                <span class="prompt-icon" aria-hidden="true">⚖️</span>
                <span class="prompt-text">Compare DCIT and DBIT</span>
              </button>
              <button class="prompt-card" type="button" data-prompt="How can I contact UCC?">
                <span class="prompt-icon" aria-hidden="true">📞</span>
                <span class="prompt-text">How can I contact UCC?</span>
              </button>
            </div>
          </div>
        </div>

        <form class="chat-composer" onsubmit="handleSubmit(event)">
          <div class="composer-inner">
            <button type="button" class="composer-attach" id="composer-attach" aria-label="Attach file" title="Attach" tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66L9.41 17.41a2 2 0 01-2.83-2.83l8.49-8.48"/>
              </svg>
            </button>
            <textarea
              id="chat-input"
              class="composer-input"
              placeholder="Message UCC Assistant…"
              autocomplete="off"
              rows="1"
              aria-label="Your message"
              enterkeyhint="send"
            ></textarea>
            <button type="submit" id="send-btn" class="composer-send" aria-label="Send message" title="Send (Enter)">
              <svg class="send-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <path d="M12 19V5M5 12l7-7 7 7"/>
              </svg>
              <svg class="stop-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <rect x="6" y="6" width="12" height="12" rx="2"/>
              </svg>
            </button>
          </div>
          <p class="composer-disclaimer">UCC Assistant can make mistakes. Verify important details at <a href="https://ucc.co.tz/" target="_blank" rel="noopener noreferrer">ucc.co.tz</a>.</p>
        </form>
      </div>
    </main>
  </div>

  <script src="js/config.js"></script>
  <script src="js/ucc-kb.js"></script>
  <script src="js/documents.js"></script>
  <script src="js/news.js"></script>
  <script src="js/chatbot.js"></script>
  <p style="text-align:center;padding:10px;font-size:0.75rem;color:var(--ucc-gray)"><a href="login.html" style="color:inherit">Login</a> · <a href="admin/news.html" style="color:inherit">Admin</a></p>
</body>
</html>

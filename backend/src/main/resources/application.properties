spring.application.name=ucc-chatbot-assistant

# Server
server.port=${PORT:8080}

# Database - supports both PostgreSQL (Netlify) and MySQL
# Set DB_TYPE=postgres to use PostgreSQL, or DB_TYPE=mysql to use MySQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ucc_chatbot_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# AI Configuration
ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://api.openai.com/v1}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.embedding.model=${AI_EMBEDDING_MODEL:text-embedding-3-small}
# AI provider: "pollinations" (free, no key) or "openai" (requires AI_API_KEY)
ai.provider=${AI_PROVIDER:}

# JWT - MUST be set via environment variable in production
jwt.secret=${JWT_SECRET:}
jwt.expiration.ms=${JWT_EXPIRATION_MS:604800000}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:8081,https://agent-6a87a4d1bce5537b6d8d53a5--uccchatbot.netlify.app}

# Frontend URL
frontend.url=${FRONTEND_URL:https://agent-6a87a4d1bce5537b6d8d53a5--uccchatbot.netlify.app}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework=INFO
logging.level.com.ucc.chatbot=DEBUG

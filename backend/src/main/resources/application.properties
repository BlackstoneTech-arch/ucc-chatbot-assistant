spring.application.name=ucc-chatbot-assistant

# Server
server.port=${PORT:8080}

# Database - server-side only. Never expose these values to the frontend.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ucc_chatbot_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.PostgreSQLDialect}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# AI Configuration
ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://api.openai.com/v1}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.embedding.model=${AI_EMBEDDING_MODEL:text-embedding-3-small}
ai.provider=${AI_PROVIDER:pollinations}
ai.always.call=${AI_ALWAYS_CALL:true}

# JWT - JWT_SECRET must be supplied through the server environment.
jwt.secret=${JWT_SECRET:}
jwt.expiration.ms=${JWT_EXPIRATION_MS:900000}
auth.refresh.expiration.days=${AUTH_REFRESH_EXPIRATION_DAYS:7}

# Authentication cookies
auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# CORS: comma-separated, explicit origins only. Do not use * with credentials.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:8081,https://uccchatbot.blackstone-tech02.workers.dev}

# Frontend URL
frontend.url=${FRONTEND_URL:https://uccchatbot.blackstone-tech02.workers.dev}

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework=INFO
logging.level.com.ucc.chatbot=INFO

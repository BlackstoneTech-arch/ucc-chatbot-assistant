spring.application.name=ucc-chatbot-assistant

# Test DB (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# AI defaults
ai.api.key=
ai.api.url=https://api.openai.com/v1
ai.model=gpt-4o-mini
ai.embedding.model=text-embedding-3-small
ai.provider=pollinations
ai.always.call=true

# JWT
jwt.secret=test-secret-key-must-be-at-least-256-bits-long-for-HS256
jwt.expiration.ms=900000
auth.refresh.expiration.days=7

# Cookies
auth.cookie.secure=false
auth.cookie.same-site=Lax

# CORS
cors.allowed-origins=http://localhost:5500,http://localhost:3000,http://localhost:3001,http://localhost:8080,http://localhost:8081,https://uccchatbot.blackstone-tech02.workers.dev

# Frontend URL
frontend.url=https://uccchatbot.blackstone-tech02.workers.dev

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.org.springframework=INFO
logging.level.com.ucc.chatbot=INFO

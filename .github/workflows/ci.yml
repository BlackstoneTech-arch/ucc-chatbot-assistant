name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Test and Lint
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: ucc_chatbot_test
          MYSQL_USER: ucc_user
          MYSQL_PASSWORD: ucc_password
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        ports:
          - 3306:3306

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint --workspace=backend
        continue-on-error: true

      - name: Run type checking
        run: npm run typecheck --workspace=backend
        continue-on-error: true

      - name: Run tests
        run: npm test --workspace=backend
        env:
          DATABASE_URL: jdbc:mysql://localhost:3306/ucc_chatbot_test?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
          AI_API_KEY: test-key
          JWT_SECRET: test-jwt-secret-key-for-ci-only
        continue-on-error: true

      - name: Build backend
        run: npm run build --workspace=backend
        continue-on-error: true

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: npm audit --audit-level=high
        continue-on-error: true
